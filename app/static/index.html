<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      data-i18n-content="app.description"
      content="Your private personal finance space."
    />
    <title>Finanza</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/i18n.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div id="login" class="login-layout" hidden>
      <label class="language-control login-language"
        ><span class="sr-only" data-i18n="app.language">Language</span
        ><select
          data-language
          data-i18n-aria-label="app.language"
          aria-label="Language"
        ></select
      ></label>
      <div class="login-story">
        <div class="brand">
          <span class="brand-icon">f.</span> finanza<span class="brand-dot"
            >•</span
          >
        </div>
        <div>
          <span class="eyebrow" data-i18n="login.eyebrow"></span>
          <h1>
            <span data-i18n="login.money"></span><br /> <span
              data-i18n="login.decisions"
            ></span
            ><br /> <span data-i18n="login.clear"></span>
          </h1>
          <p data-i18n="login.story"></p>
          <div class="login-graphic">
            <span></span><span></span><span></span><span></span><span></span
            ><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <span class="login-foot" data-i18n="login.forward"></span>
      </div>
      <div class="login-form-wrap">
        <div class="login-form">
          <span class="pill"
            >◈ &nbsp; <span data-i18n="login.private"></span
          ></span>
          <div class="login-progress" aria-label="" data-i18n-aria-label="login.steps">
            <span id="password-step"><b>1</b><span data-i18n="login.accessStep"></span></span>
            <span class="step-line" aria-hidden="true"></span>
            <span id="verification-step"><b>2</b><span data-i18n="login.verifyStep"></span></span>
          </div>
          <form id="login-form">
          <h2 data-i18n="login.welcome"></h2>
          <p data-i18n="login.subtitle"></p>
          <label
            ><span data-i18n="login.username"></span
            ><input
              id="username"
              autocomplete="username"
              required
              value="admin" /></label
          ><label
            ><span data-i18n="login.password"></span
            ><input
              id="password"
              type="password"
              autocomplete="current-password"
              required
          /></label>
          <p id="login-error" class="form-error" role="alert"></p>
          <button class="button primary" type="submit">
            <span id="password-submit" data-i18n="login.continue"></span><span aria-hidden="true">→</span>
          </button>
          <div id="passkey-login-block" hidden>
            <p class="login-or" data-i18n="login.or"></p>
            <button id="passkey-login" class="button" type="button" data-i18n="login.passkey"></button>
            <p class="login-hint" data-i18n="login.passkeyHelp"></p>
          </div>
          </form>
          <form id="verification-form" hidden>
            <h2 id="verification-title" data-i18n="login.verifyTitle"></h2>
            <p id="verification-subtitle" data-i18n="login.verifySubtitle"></p>
            <div class="password-confirmed"><span aria-hidden="true">✓</span><span data-i18n="login.passwordConfirmed"></span></div>
            <label>
              <span id="code-label" data-i18n="login.otpCode"></span>
              <input id="auth-code" class="otp-input" type="text" inputmode="numeric"
                autocomplete="one-time-code" autocapitalize="off" spellcheck="false"
                maxlength="6" pattern="[0-9]{6}" aria-describedby="mfa-help" required />
            </label>
            <small id="mfa-help" data-i18n="login.otpHelp"></small>
            <p id="verification-error" class="form-error" role="alert"></p>
            <button class="button primary" type="submit"><span data-i18n="login.verifySubmit"></span><span aria-hidden="true">↗</span></button>
            <button id="recovery-toggle" class="button login-link" type="button" data-i18n="login.useRecovery"></button>
            <button id="login-back" class="button login-link back-link" type="button"><span aria-hidden="true">←</span><span data-i18n="login.back"></span></button>
          </form>
          <small data-i18n="login.privacy"></small>
        </div>
      </div>
    </div>
    <div id="shell" hidden>
      <aside class="sidebar" id="sidebar">
        <a href="#resumen" class="brand"
          ><span class="brand-icon">f.</span> finanza<span class="brand-dot"
            >•</span
          ></a
        >
        <div class="workspace">
          <span class="avatar" data-i18n="app.me"></span>
          <div>
            <strong data-i18n="app.personalSpace"></strong
            ><small data-i18n="app.personalFinance"></small>
          </div>
          <span class="workspace-chevron">⌄</span>
        </div>
        <span class="nav-label" data-i18n="app.panorama"></span>
        <nav id="nav" data-i18n-aria-label="app.navigation"></nav>
        <div class="sidebar-note">
          <span class="note-icon">↗</span
          ><strong data-i18n="app.everyMonth"></strong>
          <p data-i18n="app.habits"></p>
          <span data-i18n="app.perspective"></span>
        </div>
        <button id="manage-passkeys" class="nav-link passkey-nav" type="button" hidden>
          <span class="passkey-icon" aria-hidden="true"></span>
          <span data-i18n="passkeys.manage"></span>
        </button>
        <div class="sidebar-bottom">
          <span class="status-dot"></span
          ><span
            ><span data-i18n="app.readonly"></span
            ><small data-i18n="app.privateDesign"></small></span
          ><span id="lock-icon"></span>
        </div>
      </aside>
      <div class="main-wrap">
        <header class="topbar">
          <div class="breadcrumb">
            <button
              id="menu"
              class="icon-button mobile-only"
              data-i18n-aria-label="app.menu"
            >
              ☰</button
            ><span id="home-icon"></span><span class="crumb-separator">/</span
            ><span data-i18n="app.mySpace"></span
            ><span class="crumb-separator">/</span><strong id="crumb"></strong>
          </div>
          <div class="topbar-right">
            <span class="private-label"
              ><span class="status-dot"></span>
              <span data-private-label></span></span
            ><label class="language-control"
              ><span class="sr-only" data-i18n="app.language"></span
              ><select
                data-language
                data-i18n-aria-label="app.language"
              ></select></label
            ><button
              id="logout"
              class="icon-button"
              data-i18n-aria-label="app.logout"
              data-i18n-title="app.logout"
            ></button
            ><span class="avatar small" data-i18n="app.me"></span>
          </div>
        </header>
        <main id="main">
          <div class="page-heading">
            <div>
              <div class="eyebrow"></div>
              <h1 id="page-title"></h1>
              <p id="page-description"></p>
            </div>
            <div class="global-controls">
              <label class="select-wrap"
                ><span id="calendar-icon"></span
                ><select id="month" data-i18n-aria-label="app.month"></select
              ></label>
              <div
                class="currency-control"
                role="group"
                data-i18n-aria-label="app.currency"
              >
                <button data-currency="SEK" class="active">SEK</button
                ><button data-currency="EUR">EUR</button>
              </div>
              <button
                id="refresh"
                class="icon-button bordered"
                data-i18n-aria-label="app.refresh"
                data-i18n-title="app.refreshTitle"
              >
                ↻
              </button>
            </div>
          </div>
          <div id="error" role="alert" class="error-banner" hidden></div>
          <div id="content" aria-live="polite">
            <div class="loading" data-i18n="app.loading"></div>
          </div>
          <footer class="page-footer">
            <span
              ><span class="status-dot"></span
              ><span data-i18n="app.localData"></span></span
            ><span
              ><span data-i18n="app.peace"></span>
              <strong>finanza.</strong></span
            >
          </footer>
        </main>
      </div>
    </div>
    <dialog id="passkeys" aria-labelledby="passkeys-title">
      <h2 id="passkeys-title" data-i18n="passkeys.title"></h2>
      <p data-i18n="passkeys.help"></p>
      <p id="passkey-reauth" hidden data-i18n="errors.reauth"></p>
      <div id="passkey-list"></div>
      <label class="passkey-name"
        ><span data-i18n="passkeys.name"></span>
        <input id="passkey-name" type="text" maxlength="64" autocomplete="off" data-i18n-placeholder="passkeys.defaultName" />
      </label>
      <p id="passkey-error" class="form-error" role="alert"></p>
      <div class="passkey-actions">
        <button id="passkey-add" class="button primary" type="button" data-i18n="passkeys.add"></button>
        <button id="passkey-close" class="button" type="button" data-i18n="passkeys.close"></button>
      </div>
    </dialog>
  </body>
</html>
