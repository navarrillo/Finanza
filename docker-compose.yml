services:
  finanzas:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_PATH: /data/${DB_FILENAME:-finanzas.db}
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Configura APP_PASSWORD en .env}
      SESSION_SECRET: ${SESSION_SECRET:?Configura SESSION_SECRET en .env}
      DEMO_MODE: ${DEMO_MODE:-false}
      MFA_REQUIRED: ${MFA_REQUIRED:-true}
      AUTH_DB_PATH: /auth/auth.db
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # Optional. Empty uses the host of PUBLIC_ORIGIN. See .env.example.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_REAUTH_SECONDS: ${WEBAUTHN_REAUTH_SECONDS:-300}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Uvicorn --proxy-headers trusts X-Forwarded-For only from this address:
      # the reverse proxy, as the app sees the connection. Never "*".
      # The default trusts loopback only. A proxy that connects from another
      # address must be set here; do not list visitor addresses.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      # Mount the DIRECTORY: atomic file replacements become visible, WAL companions too.
      - type: bind
        source: ${DB_DIRECTORY:-./data}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      # Authentication is the only persistent writable application state.
      # Financial data above remains read-only.
      - type: bind
        source: ${AUTH_DIRECTORY:-./private/auth}
        target: /auth
        read_only: false
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
