services:
  finanzas:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_PATH: /data/${DB_FILENAME:-finanzas.db}
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Configura APP_PASSWORD en .env}
      SESSION_SECRET: ${SESSION_SECRET:?Configura SESSION_SECRET en .env}
      DEMO_MODE: ${DEMO_MODE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Use the private proxy IP here if Caddy is in another container.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      # Mount the DIRECTORY: atomic file replacements become visible, WAL companions too.
      - type: bind
        source: ${DB_DIRECTORY:-./data}
        target: /data
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
